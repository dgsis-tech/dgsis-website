{{define "base"}}
<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta 
		name="viewport" 
		content="width=device-width, initial-scale=1.0"
	>

	<meta
		name="description"
		content="{{.Description}}"
	>

	<meta
		name="robots"
		content="index, follow"
	>


	<meta
		property="og:title"
		content="{{.Title}}"
	>

	<meta
		property="og:description"
		content="{{.Description}}"
	>

	<meta
		property="og:type"
		content="website"
	>


	<title>{{.Title}}</title>


	<link 
		rel="stylesheet" 
		href="/static/css/style.css"
	>

</head>

<body>

	<header class="site-header">

		<nav 
			class="site-navigation"
			aria-label="Main navigation"
		>

			<a href="/" class="site-logo">
				DGSIS
			</a>

			<div class="site-navigation__links">

				<a href="/">
					Home
				</a>

				<a href="/work">
					Work
				</a>

				<a href="/contact">
					Contact
				</a>

			</div>

		</nav>

	</header>


	<main id="main-content">

		{{template "content" .}}
	
	</main>


	<footer class="site-footer">

		<p>
			© DGSIS. Engineering software that lasts.
		</p>

	</footer>


</body>

</html>
{{end}}
