{{define "base"}}
<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<meta
		name="description"
		content="{{.Description}}"
	>

	<meta
		name="robots"
		content="index, follow"
	>

	<meta
		property="og:title"
		content="{{.Title}}"
	>

	<meta
		property="og:description"
		content="{{.Description}}"
	>

	<meta
		property="og:type"
		content="website"
	>

	<title>{{.Title}}</title>

	<link
		rel="icon"
		href="/static/images/favicon.svg"
		type="image/svg+xml"
	>

	<link
		rel="stylesheet"
		href="/static/css/style.css"
	>

</head>

<body>

	<a class="skip-link" href="#main-content">
		Skip to content
	</a>

	<header class="site-header">

		<nav
			class="site-navigation"
			aria-label="Main navigation"
		>

			<a href="/" class="site-logo" aria-label="DGSIS home">
				<svg class="site-logo__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
					<path d="M16 2.5 28.5 9.5v13L16 29.5 3.5 22.5v-13L16 2.5Z" />
				</svg>
				<span>DGSIS</span>
			</a>

			<div class="site-navigation__links">

				<a
					href="/"
					{{if eq .CurrentPath "/"}}aria-current="page"{{end}}
				>
					Home
				</a>

				<a
					href="/engineering"
					{{if eq .CurrentPath "/engineering"}}aria-current="page"{{end}}
				>
					Engineering
				</a>

				<a
					href="/work"
					{{if eq .CurrentPath "/work"}}aria-current="page"{{end}}
				>
					Work
				</a>

				<a
					href="/contact"
					{{if eq .CurrentPath "/contact"}}aria-current="page"{{end}}
				>
					Contact
				</a>

			</div>

		</nav>

	</header>


	<main id="main-content">

		{{template "content" .}}

	</main>


	<footer class="site-footer">

		<div class="site-footer__inner">

			<p class="site-footer__brand">
				DGSIS
			</p>

			<p>
				Engineering software that lasts.
			</p>

			<p class="site-footer__meta">
				<a href="mailto:info@dgsis.com">info@dgsis.com</a>
				<span aria-hidden="true">·</span>
				<span>© DGSIS LLC</span>
			</p>

		</div>

	</footer>


</body>

</html>
{{end}}
