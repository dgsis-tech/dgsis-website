{{define "content"}}

<section class="page-intro" aria-labelledby="page-title">

	<p class="page-intro__eyebrow">
		{{.Msg.ContactEyebrow}}
	</p>

	<h1 id="page-title">
		{{.Msg.ContactH1}}
	</h1>

	<p class="page-intro__description">
		{{.Msg.ContactLead}}
	</p>

</section>


<section class="contact contact--page" aria-labelledby="conversation-title">

	<h2 id="conversation-title">
		{{.Msg.ContactConvH2}}
	</h2>

	<p class="contact__description">
		{{.Msg.ContactConvLead}}
	</p>

	<a href="mailto:info@dgsis.com" class="contact__action">
		{{.Msg.ContactMailto}}
	</a>

	<form
		class="contact-form"
		id="contact-form"
		method="post"
		action="/contact"
		hx-post="/contact"
		hx-target="#contact-form-feedback"
		hx-swap="innerHTML"
		novalidate
	>

		<div class="contact-form__field">
			<label for="name">{{.Msg.ContactName}}</label>
			<input
				id="name"
				name="name"
				type="text"
				autocomplete="name"
				required
				maxlength="80"
			>
		</div>

		<div class="contact-form__field">
			<label for="email">{{.Msg.ContactEmail}}</label>
			<input
				id="email"
				name="email"
				type="email"
				autocomplete="email"
				required
				maxlength="120"
			>
		</div>

		<div class="contact-form__field">
			<label for="company">{{.Msg.ContactCompany}} <span class="contact-form__optional">{{.Msg.ContactOptional}}</span></label>
			<input
				id="company"
				name="company"
				type="text"
				autocomplete="organization"
				maxlength="120"
			>
		</div>

		<div class="contact-form__field">
			<label for="message">{{.Msg.ContactMessage}}</label>
			<textarea
				id="message"
				name="message"
				rows="6"
				required
				minlength="20"
				maxlength="4000"
				placeholder="{{.Msg.ContactPlaceholder}}"
			></textarea>
		</div>

		<div class="contact-form__hp" aria-hidden="true">
			<label for="website">Website</label>
			<input
				id="website"
				name="website"
				type="text"
				tabindex="-1"
				autocomplete="off"
			>
		</div>

		<button type="submit" class="contact__action contact-form__submit">
			{{.Msg.ContactSubmit}}
		</button>

		<div
			id="contact-form-feedback"
			class="contact-form__feedback"
			aria-live="polite"
		>{{.FormFeedback}}</div>

	</form>

	<p class="contact__note">
		{{.Msg.ContactNote}}
	</p>

</section>

{{end}}
